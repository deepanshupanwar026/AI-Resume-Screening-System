<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recruiter Registration | AI Resume Screening</title>

    <link rel="stylesheet" href="auth.css">

</head>


<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <div class="auth-container">

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <h1>
                AI Resume Screening
            </h1>

            <p>
                Build your intelligent hiring workspace
            </p>

        </div>


        <!-- REGISTER CARD -->

        <div class="auth-card">

            <div class="card-header">

                <span class="small-label">
                    RECRUITER PORTAL
                </span>

                <h2>
                    Create Account
                </h2>

                <p>
                    Register to start managing your recruitment process.
                </p>

            </div>


            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Recruiter Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="recruiter@example.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >

                    Create Account

                    <span>→</span>

                </button>


                <!-- MESSAGE -->

                <div
                    id="registerMessage"
                    class="auth-message"
                ></div>


            </form>


            <!-- LOGIN LINK -->

            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="/login.html">
                    Sign In
                </a>

            </div>

        </div>


        <!-- SECURITY -->

        <div class="security-note">

            🔒 Secure recruiter authentication

        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>
