<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recruiter Login | AI Resume Screening</title>

    <link rel="stylesheet" href="auth.css">

</head>


<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <div class="auth-container">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <h1>
                AI Resume Screening
            </h1>

            <p>
                Intelligent hiring starts here
            </p>

        </div>


        <div class="auth-card">

            <div class="card-header">

                <span class="small-label">
                    RECRUITER PORTAL
                </span>

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to manage your recruitment process.
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="recruiter@example.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >

                    Sign In
                    <span>→</span>

                </button>


                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>

            </form>


            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="/register.html">
                    Create Account
                </a>

            </div>

        </div>


        <div class="security-note">

            🔒 Secure recruiter authentication

        </div>

    </div>


    <script src="/auth.js?v=2"></script>

</body>

</html>
